name: Build Roblox server bundle
on:
  push:
    branches: [main]
    paths: ['sources/**', 'source-index.json', 'tools/build_bundle.py', 'scripts/setup.lua']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roblox-bundle
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/build_bundle.py
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-bundle.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Roblox runtime bundle"
            git push
          fi
